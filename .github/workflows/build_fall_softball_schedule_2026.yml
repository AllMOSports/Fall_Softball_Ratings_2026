name: Build Fall Softball Schedule (2026)
 
on:
  # Manual trigger from the Actions tab
  workflow_dispatch:
 
  # Auto-run nightly during the 2026 fall softball season (Aug-Nov).
  # UNLIKE FOOTBALL: football's schedule only runs Thu/Fri/Sat, so its
  # workflow only scrapes those 3 days. Fall softball games are spread
  # across more weekdays (not confirmed to be every single day, but
  # nothing as narrow as football's 3-day pattern either), so this runs
  # every day during the season instead of guessing which days to skip --
  # a day with no games just means the scraper finds 0 games and nothing
  # gets committed. Tighten this to specific days once you've confirmed
  # fall softball's actual game-day pattern, the same way football's was.
  # Times are UTC. Odd/off-peak minute (23) to avoid GitHub's top-of-hour
  # scheduler congestion, and offset from football's :17 so both jobs
  # aren't hitting MSHSAA's site in the same minute if they ever overlap.
  schedule:
    - cron: '23 5 * 8,9,10,11 *'
 
permissions:
  contents: write
 
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # this script typically finishes in a few minutes; 15 gives headroom without risking a runaway job
 
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas
 
      - name: Debug - list repo contents
        run: |
          pwd
          ls -la
 
      - name: Run scraper
        run: python scrape_fall_softball_games_2026.py
 
      # Rebuilds fall_softball_schedule_2026.json (the per-team keyed
      # format the Sport Detail snippet's SCHEDULE_URLS reads) from
      # whatever scrape_fall_softball_games_2026.py just wrote to
      # fall_softball_games_2026_all.json. Runs every time this job runs
      # -- cheap, and keeps the two files from ever drifting out of sync.
      # See build_fall_softball_schedule_2026.py's own docstring for what
      # it does and doesn't populate (no predicted scores/deltas until a
      # fall softball ratings file exists).
      - name: Rebuild per-team schedule file
        run: python build_fall_softball_schedule_2026.py fall_softball_games_2026_all.json fall_softball_schedule_2026.json
 
      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fall_softball_games_2026.json fall_softball_games_2026.csv fall_softball_games_2026_all.json fall_softball_games_2026_all.csv fall_softball_schedule_2026.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Update 2026 fall softball games [automated]"
          git push
