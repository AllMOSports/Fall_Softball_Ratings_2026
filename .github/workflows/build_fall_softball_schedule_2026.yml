name: Build Fall Softball Schedule (2026)

on:
  # Manual trigger from the Actions tab
  workflow_dispatch: {}
 
  # Auto-run whenever the already-scraped games file changes, so the
  # per-team schedule file never drifts out of sync with it. This
  # workflow does NOT scrape MSHSAA itself -- that's handled elsewhere;
  # this only rebuilds fall_softball_schedule_2026.json from whatever
  # fall_softball_games_2026_all.json already contains.
  push:
    branches: [main]
    paths:
      - 'fall_softball_games_2026_all.json'
      - 'build_fall_softball_schedule_2026.py'
 
permissions:
  contents: write   # needed to commit fall_softball_schedule_2026.json back to the repo
 
jobs:
  build-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
 
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Run build_fall_softball_schedule_2026.py
        run: python build_fall_softball_schedule_2026.py fall_softball_games_2026_all.json fall_softball_schedule_2026.json
 
      - name: Commit and push fall_softball_schedule_2026.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fall_softball_schedule_2026.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update fall_softball_schedule_2026.json"
          git push
